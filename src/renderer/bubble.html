<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'"
    />
    <title>Mischief Bubble</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        height: 100vh;
        padding-bottom: 4px;
      }
      #bubble {
        display: none;
        max-width: 180px;
        padding: 8px 14px;
        border-radius: 18px;
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(52, 211, 153, 0.35);
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        font-weight: 600;
        text-align: center;
        line-height: 1.35;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 12px rgba(52, 211, 153, 0.2);
        animation: pop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        position: relative;
      }
      #bubble::after {
        content: "";
        position: absolute;
        bottom: -6px;
        left: 50%;
        transform: translateX(-50%);
        border-width: 6px 6px 0;
        border-style: solid;
        border-color: rgba(15, 23, 42, 0.92) transparent transparent transparent;
      }
      @keyframes pop {
        0% { opacity: 0; transform: scale(0.5) translateY(8px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }
      #bubble.fade {
        animation: pop 0.3s ease-in forwards;
        animation-direction: reverse;
      }
    </style>
  </head>
  <body>
    <div id="bubble"></div>
    <script>
      const bubble = document.getElementById("bubble");
      let timer = null;

      function show(text, durationMs) {
        if (timer) clearTimeout(timer);
        bubble.textContent = text;
        bubble.style.display = "block";
        bubble.classList.remove("fade");
        bubble.style.animation = "none";
        void bubble.offsetWidth;
        bubble.style.animation = "";
        timer = setTimeout(hide, durationMs);
      }

      function hide() {
        if (timer) clearTimeout(timer);
        timer = null;
        bubble.classList.add("fade");
        setTimeout(() => {
          bubble.style.display = "none";
          bubble.classList.remove("fade");
        }, 300);
      }

      if (window.mischief && window.mischief.onBubble) {
        window.mischief.onBubble((detail) => {
          if (detail && detail.text) {
            show(detail.text, detail.durationMs || 3500);
          }
        });
      }
    </script>
  </body>
</html>
