<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' mischief-asset:"
    />
    <title>Mischief</title>
    <script src="procedural.renderer.js"></script>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        user-select: none;
      }

      body.interactive {
        cursor: pointer;
      }

      #creature {
        position: absolute;
        left: 8px;
        top: 8px;
        width: 80px;
        height: 80px;
        transform-origin: 50% 90%;
      }

      #creature img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      #zzz {
        position: absolute;
        top: 2px;
        right: 4px;
        font-size: 14px;
        font-weight: 700;
        color: rgba(30, 41, 59, 0.6);
        opacity: 0;
      }

      /* Behavior animations */
      .anim-idle {
        animation: bob 2s ease-in-out infinite;
      }

      .anim-move {
        animation: sway 0.9s ease-in-out infinite;
      }

      .anim-sleep {
        animation: sleep-bob 3s ease-in-out infinite;
      }

      .anim-sleep #zzz {
        animation: zzz 2.4s ease-in-out infinite;
        opacity: 1;
      }

      .anim-yawn {
        animation: yawn 2.2s ease;
      }

      .anim-happy {
        animation: happy 0.7s ease-in-out 5;
      }

      @keyframes bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }

      @keyframes sway {
        0%,
        100% {
          transform: translateY(-2px) rotate(-4deg);
        }
        50% {
          transform: translateY(-6px) rotate(4deg);
        }
      }

      @keyframes sleep-bob {
        0%,
        100% {
          transform: translateY(2px) scale(0.96);
        }
        50% {
          transform: translateY(0) scale(0.96);
        }
      }

      @keyframes zzz {
        0% {
          transform: translate(0, 0);
          opacity: 0;
        }
        30% {
          opacity: 1;
        }
        100% {
          transform: translate(8px, -14px);
          opacity: 0;
        }
      }

      @keyframes yawn {
        0% {
          transform: scale(1, 1);
        }
        40% {
          transform: scale(1.08, 0.92) translateY(2px);
        }
        70% {
          transform: scale(0.96, 1.04);
        }
        100% {
          transform: scale(1, 1);
        }
      }

      @keyframes happy {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        25% {
          transform: translateY(-10px) rotate(-6deg);
        }
        75% {
          transform: translateY(-10px) rotate(6deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="creature" aria-label="Mischief companion"><span id="zzz">z</span></div>
    <script>
      const creature = document.getElementById("creature");
      const params = new URLSearchParams(location.search);
      const sprite = params.get("sprite");

      if (sprite) {
        const img = document.createElement("img");
        img.src = sprite;
        img.alt = "Mischief companion";
        creature.prepend(img);
      } else {
        creature.innerHTML =
          `
          <svg viewBox="0 0 80 80" width="80" height="80" aria-hidden="true">
            <rect x="16" y="24" width="48" height="40" rx="10" fill="#4ade80"/>
            <rect x="8"  y="28" width="16" height="18" rx="8" fill="#4ade80"/>
            <rect x="56" y="28" width="16" height="18" rx="8" fill="#4ade80"/>
            <rect x="28" y="40" width="8"  height="8"  rx="4" fill="#1e293b"/>
            <rect x="44" y="40" width="8"  height="8"  rx="4" fill="#1e293b"/>
            <rect x="32" y="54" width="16" height="4"  rx="2" fill="#1e293b"/>
          </svg>` + creature.innerHTML;
      }

      const ANIM_CLASSES = {
        idle: "anim-idle",
        walk: "anim-move",
        waddle: "anim-move",
        stroll: "anim-move",
        float: "anim-move",
        glide: "anim-move",
        fly: "anim-move",
        sneak: "anim-move",
        run: "anim-move",
        pounce: "anim-move",
        jump: "anim-move",
        sleep: "anim-sleep",
        yawn: "anim-yawn",
        happy: "anim-happy",
      };
      const ONE_SHOT = new Set(["anim-yawn", "anim-happy"]);
      const ANIM_TO_PET_STATE = {
        walk: "walk",
        run: "run",
        happy: "happy",
        sad: "sad",
        sleep: "sleep",
        yawn: "yawn",
      };

      let currentAnim = "idle";

      function applyAnim(anim) {
        currentAnim = anim;
        const cls = ANIM_CLASSES[anim] || "anim-idle";
        creature.className = cls;
        if (ONE_SHOT.has(cls)) {
          creature.addEventListener(
            "animationend",
            () => {
              creature.className = "anim-idle";
            },
            { once: true }
          );
        }
      }

      applyAnim("idle");

      // --- Procedural pet animation (canvas) --------------------------------

      let petMeta = null;
      let petState = "idle";
      let petImage = null;
      let petCanvas = null;
      let petRaf = null;

      function drawEffects(ctx, effects) {
        if (!petMeta || !petMeta.face) return;
        const W = petCanvas.width;
        const H = petCanvas.height;
        const fx = petMeta.face.x * W;
        const fy = petMeta.face.y * H;
        for (const cue of effects) {
          const x = fx + cue.ox * W;
          const y = fy + cue.oy * H;
          if (cue.kind === "blink") {
            ctx.fillStyle = "rgba(15, 23, 42, 0.8)";
            const w = 0.3 * W;
            const h = 0.035 * W;
            roundRect(ctx, x - w / 2, y - h / 2, w, h, h / 2);
            ctx.fill();
          } else if (cue.kind === "mouth") {
            ctx.fillStyle = "rgba(15, 23, 42, 0.75)";
            const w = 0.16 * W;
            const h = 0.04 * W * Math.sin(Math.PI * cue.phase);
            ctx.beginPath();
            ctx.ellipse(x, y, w / 2, Math.max(0.5, h), 0, 0, Math.PI * 2);
            ctx.fill();
          } else if (cue.kind === "zzz") {
            const alpha = Math.sin(Math.PI * cue.phase);
            ctx.fillStyle = `rgba(30, 41, 59, ${0.7 * alpha})`;
            ctx.font = `${0.16 * W}px serif`;
            ctx.fillText("z", x, y);
          } else if (cue.kind === "hearts") {
            const alpha = Math.sin(Math.PI * cue.phase);
            ctx.fillStyle = `rgba(239, 68, 68, ${0.9 * alpha})`;
            ctx.font = `${0.15 * W}px serif`;
            ctx.fillText("\u2665", x, y);
          } else if (cue.kind === "tears") {
            ctx.fillStyle = "rgba(56, 189, 248, 0.85)";
            ctx.beginPath();
            ctx.arc(x, y, 0.02 * W, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      const { motionFor, sanitizePetMeta } = window.MischiefProcedural || {};

      function petLoop() {
        if (!petCanvas || !petImage || !petMeta || !motionFor) return;
        const frame = motionFor(petState, performance.now() / 1000, petMeta);
        const ctx = petCanvas.getContext("2d");
        const W = petCanvas.width;
        const H = petCanvas.height;
        ctx.clearRect(0, 0, W, H);
        ctx.globalAlpha = frame.motion.opacity;
        ctx.save();
        ctx.translate(W / 2 + frame.motion.dx, H * 0.92 + frame.motion.dy);
        ctx.rotate((frame.motion.rotate * Math.PI) / 180);
        ctx.scale(frame.motion.scaleX, frame.motion.scaleY);
        const iw = petImage.naturalWidth;
        const ih = petImage.naturalHeight;
        const scale = Math.min(W / iw, H / ih) * 0.9;
        ctx.drawImage(petImage, (-iw * scale) / 2, -ih * scale, iw * scale, ih * scale);
        ctx.restore();
        ctx.globalAlpha = 1;
        drawEffects(ctx, frame.effects);
        petRaf = requestAnimationFrame(petLoop);
      }

      function startPet(url, meta) {
        stopPet();
        if (!motionFor || !sanitizePetMeta) {
          handleSprite(url, { cutout: false, face: null });
          return;
        }
        petMeta = sanitizePetMeta(meta);
        petState = "idle";
        creature.className = "";
        const zzz = document.getElementById("zzz");
        if (zzz) zzz.style.display = "none";
        const cssImg = creature.querySelector("img");
        if (cssImg) cssImg.style.display = "none";
        if (!petCanvas) {
          petCanvas = document.createElement("canvas");
          petCanvas.id = "petCanvas";
          petCanvas.style.position = "absolute";
          petCanvas.style.inset = "0";
          petCanvas.width = 80;
          petCanvas.height = 80;
          creature.prepend(petCanvas);
        }
        const image = new Image();
        image.onload = () => {
          petImage = image;
          petLoop();
        };
        image.src = url;
      }

      function stopPet() {
        if (petRaf) {
          cancelAnimationFrame(petRaf);
          petRaf = null;
        }
        petImage = null;
      }

      function handleSprite(url, meta) {
        if (meta && meta.cutout) {
          startPet(url, meta);
          return;
        }
        stopPet();
        if (petCanvas) petCanvas.remove();
        petCanvas = null;
        petMeta = null;
        const zzz = document.getElementById("zzz");
        if (zzz) zzz.style.display = "";
        let img = creature.querySelector("img");
        if (!img) {
          img = document.createElement("img");
          img.alt = "Mischief companion";
          creature.prepend(img);
        }
        img.style.display = "";
        img.src = url;
        applyAnim(currentAnim);
      }

      if (window.mischief && window.mischief.getPetMeta) {
        window.mischief.getPetMeta().then((message) => {
          if (message && message.meta && message.meta.cutout) {
            startPet(message.url, message.meta);
          }
        });
      }

      if (window.mischief && window.mischief.onBehavior) {
        window.mischief.onBehavior((behavior) => {
          petState = ANIM_TO_PET_STATE[behavior.anim] || "idle";
          applyAnim(behavior.anim);
        });
      }

      if (window.mischief && window.mischief.onSprite) {
        window.mischief.onSprite((message) => {
          handleSprite(message.url, message.meta);
        });
      }

      creature.addEventListener("click", (event) => {
        if (window.mischief && window.mischief.pet) {
          window.mischief.pet(event.clientX, event.clientY);
        }
      });

      if (window.mischief && window.mischief.onInteractive) {
        window.mischief.onInteractive((enabled) => {
          document.body.classList.toggle("interactive", enabled);
        });
      }
    </script>
  </body>
</html>
