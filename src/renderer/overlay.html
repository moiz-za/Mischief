<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' blob: mischief-asset:; connect-src 'self' blob: mischief-asset:"
    />
    <title>Mischief</title>
    <script src="procedural.renderer.js"></script>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        user-select: none;
      }

      body.interactive {
        cursor: pointer;
      }

      #creature {
        position: absolute;
        left: 8px;
        top: 8px;
        width: 80px;
        height: 80px;
        transform-origin: 50% 90%;
      }

      #creature img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      #zzz {
        position: absolute;
        top: 2px;
        right: 4px;
        font-size: 14px;
        font-weight: 700;
        color: rgba(30, 41, 59, 0.6);
        opacity: 0;
      }

      /* Behavior animations */
      .anim-idle {
        animation: bob 2s ease-in-out infinite;
      }

      .anim-move {
        animation: sway 0.9s ease-in-out infinite;
      }

      .anim-sleep {
        animation: sleep-bob 3s ease-in-out infinite;
      }

      .anim-sleep #zzz {
        animation: zzz 2.4s ease-in-out infinite;
        opacity: 1;
      }

      .anim-yawn {
        animation: yawn 2.2s ease;
      }

      .anim-happy {
        animation: happy 0.7s ease-in-out 5;
      }

      .anim-sneak {
        animation: sneak 1.6s ease-in-out infinite;
      }

      .anim-pounce {
        animation: pounce 1.1s ease-in-out infinite;
      }

      .anim-spin {
        animation: spin 0.9s linear infinite;
        /* Rotate about the center and shrink so the corners never exceed the
           window bounds and get clipped by the transparent frame. */
        transform-origin: 50% 50%;
      }

      .anim-dance {
        animation: dance 0.7s ease-in-out infinite;
      }

      .anim-hide {
        animation: hide 1.2s ease-in-out infinite;
      }

      .anim-peek {
        animation: peek 1.4s ease-in-out infinite;
      }

      @keyframes bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }

      @keyframes sway {
        0%,
        100% {
          transform: translateY(-2px) rotate(-4deg);
        }
        50% {
          transform: translateY(-6px) rotate(4deg);
        }
      }

      @keyframes sleep-bob {
        0%,
        100% {
          transform: translateY(2px) scale(0.96);
        }
        50% {
          transform: translateY(0) scale(0.96);
        }
      }

      @keyframes zzz {
        0% {
          transform: translate(0, 0);
          opacity: 0;
        }
        30% {
          opacity: 1;
        }
        100% {
          transform: translate(8px, -14px);
          opacity: 0;
        }
      }

      @keyframes yawn {
        0% {
          transform: scale(1, 1);
        }
        40% {
          transform: scale(1.08, 0.92) translateY(2px);
        }
        70% {
          transform: scale(0.96, 1.04);
        }
        100% {
          transform: scale(1, 1);
        }
      }

      @keyframes happy {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        25% {
          transform: translateY(-10px) rotate(-6deg);
        }
        75% {
          transform: translateY(-10px) rotate(6deg);
        }
      }

      @keyframes sneak {
        0%,
        100% {
          transform: translateX(-4px) translateY(3px) rotate(-3deg);
        }
        50% {
          transform: translateX(4px) translateY(1px) rotate(3deg);
        }
      }

      @keyframes pounce {
        0%,
        100% {
          transform: translateX(0) translateY(0) scale(1);
        }
        35% {
          transform: translateX(10px) translateY(-12px) scale(1.15, 0.9) rotate(6deg);
        }
        65% {
          transform: translateX(4px) translateY(0) scale(0.95, 1.1) rotate(-4deg);
        }
      }

      @keyframes spin {
        from {
          transform: rotate(0deg) scale(0.8);
        }
        to {
          transform: rotate(360deg) scale(0.8);
        }
      }

      @keyframes dance {
        0%,
        100% {
          transform: translateX(-5px) rotate(-8deg);
        }
        50% {
          transform: translateX(5px) translateY(-8px) rotate(8deg);
        }
      }

      @keyframes hide {
        0%,
        100% {
          transform: translateY(8px) scale(1.15, 0.5);
          opacity: 0.7;
        }
        50% {
          transform: translateY(9px) scale(1.15, 0.45);
          opacity: 0.55;
        }
      }

      @keyframes peek {
        0%,
        100% {
          transform: translateY(6px) scale(1.05, 0.8);
        }
        50% {
          transform: translateY(-4px) scale(1, 1);
        }
      }
    </style>
  </head>
  <body>
    <div id="creature" aria-label="Mischief companion"><span id="zzz">z</span></div>
    <script>
      const creature = document.getElementById("creature");
      const params = new URLSearchParams(location.search);
      const sprite = params.get("sprite");

      // --- Pixel-aware click-through ---------------------------------------
      // Sprites are re-served as blob URLs so canvases stay origin-clean and we
      // can read alpha values (getImageData would throw on tainted canvases).
      const hitCanvas = document.createElement("canvas");
      hitCanvas.width = 96;
      hitCanvas.height = 96;
      const hitCtx = hitCanvas.getContext("2d");
      let hitRasterValid = false;
      let lastHit = false;

      async function spriteToBlobUrl(url) {
        try {
          const res = await fetch(url);
          if (!res.ok) return null;
          return URL.createObjectURL(await res.blob());
        } catch {
          return null;
        }
      }

      function rasterizeHit() {
        hitCtx.clearRect(0, 0, 96, 96);
        const img = creature.querySelector("img");
        if (!img || !img.complete || !img.naturalWidth || !img.naturalHeight) {
          hitRasterValid = false;
          return;
        }
        const iw = img.naturalWidth;
        const ih = img.naturalHeight;
        const s = Math.min(80 / iw, 80 / ih);
        const w = iw * s;
        const h = ih * s;
        hitCtx.drawImage(img, 8 + (80 - w) / 2, 8 + (80 - h) / 2, w, h);
        hitRasterValid = true;
      }

      function sampleHit(clientX, clientY) {
        const x = Math.round(clientX);
        const y = Math.round(clientY);
        if (x < 0 || y < 0 || x >= 96 || y >= 96) return false;
        try {
          if (motionCanvas && motionCanvas.width) {
            const dx = x - 8;
            const dy = y - 8;
            if (dx < 0 || dy < 0 || dx >= 80 || dy >= 80) return false;
            const d = motionCanvas.getContext("2d").getImageData(dx, dy, 1, 1).data;
            return d[3] > 12;
          }
          if (hitRasterValid) {
            const d = hitCtx.getImageData(x, y, 1, 1).data;
            return d[3] > 12;
          }
        } catch {
          return x >= 8 && x < 88 && y >= 8 && y < 88;
        }
        return hitRasterValid ? false : x >= 8 && x < 88 && y >= 8 && y < 88;
      }

      window.addEventListener("mousemove", (event) => {
        if (!window.mischief || !window.mischief.setOverlayHit) return;
        if (dragging) return;
        const hit = sampleHit(event.clientX, event.clientY);
        if (hit !== lastHit) {
          lastHit = hit;
          window.mischief.setOverlayHit(hit);
        }
      });

      if (sprite) {
        const img = document.createElement("img");
        img.alt = "Mischief companion";
        img.addEventListener("load", rasterizeHit);
        creature.prepend(img);
        spriteToBlobUrl(sprite).then((blobUrl) => {
          img.src = blobUrl || sprite;
        });
      } else {
        creature.innerHTML =
          `
          <svg viewBox="0 0 80 80" width="80" height="80" aria-hidden="true">
            <rect x="16" y="24" width="48" height="40" rx="10" fill="#4ade80"/>
            <rect x="8"  y="28" width="16" height="18" rx="8" fill="#4ade80"/>
            <rect x="56" y="28" width="16" height="18" rx="8" fill="#4ade80"/>
            <rect x="28" y="40" width="8"  height="8"  rx="4" fill="#1e293b"/>
            <rect x="44" y="40" width="8"  height="8"  rx="4" fill="#1e293b"/>
            <rect x="32" y="54" width="16" height="4"  rx="2" fill="#1e293b"/>
          </svg>` + creature.innerHTML;
      }

      const ANIM_CLASSES = {
        idle: "anim-idle",
        walk: "anim-move",
        waddle: "anim-move",
        stroll: "anim-move",
        float: "anim-move",
        glide: "anim-move",
        fly: "anim-move",
        sneak: "anim-sneak",
        run: "anim-move",
        pounce: "anim-pounce",
        jump: "anim-move",
        spin: "anim-spin",
        dance: "anim-dance",
        hide: "anim-hide",
        peek: "anim-peek",
        sleep: "anim-sleep",
        yawn: "anim-yawn",
        happy: "anim-happy",
      };
      const ONE_SHOT = new Set(["anim-yawn", "anim-happy"]);
      const ANIM_TO_MOTION_STATE = {
        walk: "walk",
        run: "run",
        happy: "happy",
        sad: "sad",
        sleep: "sleep",
        yawn: "yawn",
        sneak: "sneak",
        pounce: "pounce",
        spin: "spin",
        dance: "dance",
        hide: "hide",
        peek: "peek",
      };

      let currentAnim = "idle";

      function applyAnim(anim) {
        currentAnim = anim;
        const cls = ANIM_CLASSES[anim] || "anim-idle";
        creature.className = cls;
        if (ONE_SHOT.has(cls)) {
          creature.addEventListener(
            "animationend",
            () => {
              creature.className = "anim-idle";
            },
            { once: true }
          );
        }
      }

      applyAnim("idle");

      // --- Procedural companion animation (canvas) --------------------------

      let companionMeta = null;
      let motionState = "idle";
      let motionImage = null;
      let motionCanvas = null;
      let motionRaf = null;

      function drawEffects(ctx, effects) {
        if (!companionMeta || !companionMeta.face) return;
        const W = motionCanvas.width;
        const H = motionCanvas.height;
        const fx = companionMeta.face.x * W;
        const fy = companionMeta.face.y * H;
        for (const cue of effects) {
          const x = fx + cue.ox * W;
          const y = fy + cue.oy * H;
          if (cue.kind === "blink") {
            ctx.fillStyle = "rgba(15, 23, 42, 0.8)";
            const w = 0.3 * W;
            const h = 0.035 * W;
            roundRect(ctx, x - w / 2, y - h / 2, w, h, h / 2);
            ctx.fill();
          } else if (cue.kind === "mouth") {
            ctx.fillStyle = "rgba(15, 23, 42, 0.75)";
            const w = 0.16 * W;
            const h = 0.04 * W * Math.sin(Math.PI * cue.phase);
            ctx.beginPath();
            ctx.ellipse(x, y, w / 2, Math.max(0.5, h), 0, 0, Math.PI * 2);
            ctx.fill();
          } else if (cue.kind === "zzz") {
            const alpha = Math.sin(Math.PI * cue.phase);
            ctx.fillStyle = `rgba(30, 41, 59, ${0.7 * alpha})`;
            ctx.font = `${0.16 * W}px serif`;
            ctx.fillText("z", x, y);
          } else if (cue.kind === "hearts") {
            const alpha = Math.sin(Math.PI * cue.phase);
            ctx.fillStyle = `rgba(239, 68, 68, ${0.9 * alpha})`;
            ctx.font = `${0.15 * W}px serif`;
            ctx.fillText("\u2665", x, y);
          } else if (cue.kind === "tears") {
            ctx.fillStyle = "rgba(56, 189, 248, 0.85)";
            ctx.beginPath();
            ctx.arc(x, y, 0.02 * W, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      const { motionFor, sanitizeCompanionMeta } = window.MischiefProcedural || {};

      function motionLoop() {
        if (!motionCanvas || !motionImage || !companionMeta || !motionFor) return;
        const frame = motionFor(motionState, performance.now() / 1000, companionMeta);
        const ctx = motionCanvas.getContext("2d");
        const W = motionCanvas.width;
        const H = motionCanvas.height;
        ctx.clearRect(0, 0, W, H);
        ctx.globalAlpha = frame.motion.opacity;
        ctx.save();
        const pivotY = motionState === "spin" ? H * 0.5 : H * 0.92;
        ctx.translate(W / 2 + frame.motion.dx, pivotY + frame.motion.dy);
        ctx.rotate((frame.motion.rotate * Math.PI) / 180);
        ctx.scale(frame.motion.scaleX, frame.motion.scaleY);
        const iw = motionImage.naturalWidth;
        const ih = motionImage.naturalHeight;
        const scale = Math.min(W / iw, H / ih) * 0.9;
        ctx.drawImage(motionImage, (-iw * scale) / 2, -ih * scale, iw * scale, ih * scale);
        ctx.restore();
        ctx.globalAlpha = 1;
        drawEffects(ctx, frame.effects);
        motionRaf = requestAnimationFrame(motionLoop);
      }

      let motionGeneration = 0;

      function startMotion(url, meta) {
        stopMotion();
        const gen = ++motionGeneration;
        if (!motionFor || !sanitizeCompanionMeta) {
          handleSprite(url, { cutout: false, face: null });
          return;
        }
        companionMeta = sanitizeCompanionMeta(meta);
        motionState = "idle";
        creature.className = "";
        const zzz = document.getElementById("zzz");
        if (zzz) zzz.style.display = "none";
        const cssImg = creature.querySelector("img");
        if (cssImg) cssImg.style.display = "none";
        if (!motionCanvas) {
          motionCanvas = document.createElement("canvas");
          motionCanvas.id = "motionCanvas";
          motionCanvas.style.position = "absolute";
          motionCanvas.style.inset = "0";
          motionCanvas.width = 80;
          motionCanvas.height = 80;
          creature.prepend(motionCanvas);
        }
        const image = new Image();
        image.onload = () => {
          if (gen !== motionGeneration) return;
          motionImage = image;
          motionLoop();
        };
        spriteToBlobUrl(url).then((blobUrl) => {
          if (gen !== motionGeneration) return;
          image.src = blobUrl || url;
        });
      }

      function stopMotion() {
        motionGeneration++;
        if (motionRaf) {
          cancelAnimationFrame(motionRaf);
          motionRaf = null;
        }
        motionImage = null;
      }

      function handleSprite(url, meta) {
        if (meta && meta.cutout) {
          startMotion(url, meta);
          return;
        }
        stopMotion();
        if (motionCanvas) motionCanvas.remove();
        motionCanvas = null;
        companionMeta = null;
        const zzz = document.getElementById("zzz");
        if (zzz) zzz.style.display = "";
        let img = creature.querySelector("img");
        if (!img) {
          img = document.createElement("img");
          img.alt = "Mischief companion";
          creature.prepend(img);
        }
        img.style.display = "";
        img.src = url;
        img.addEventListener("load", rasterizeHit);
        spriteToBlobUrl(url).then((blobUrl) => {
          if (blobUrl && img.isConnected) img.src = blobUrl;
        });
        applyAnim(currentAnim);
      }

      if (window.mischief && window.mischief.getCompanionSprite) {
        window.mischief.getCompanionSprite().then((message) => {
          if (message && message.meta && message.meta.cutout) {
            startMotion(message.url, message.meta);
          }
        });
      }

      if (window.mischief && window.mischief.onBehavior) {
        window.mischief.onBehavior((behavior) => {
          motionState = ANIM_TO_MOTION_STATE[behavior.anim] || "idle";
          applyAnim(behavior.anim);
        });
      }

      if (window.mischief && window.mischief.onSprite) {
        window.mischief.onSprite((message) => {
          handleSprite(message.url, message.meta);
        });
      }

      // --- Drag-to-move (always available) --------------------------------
      // The companion can be grabbed and moved at any time - even when
      // interactive (petting) is off - so the user can relocate it if it is
      // covering something. Native HTML image drag is suppressed so the
      // companion moves instead of the raw image ghost.
      let dragState = null; // { startX, startY, active, moved }
      let lastDragMoved = false;
      let dragging = false;

      creature.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        lastDragMoved = false;
        dragState = { startX: event.clientX, startY: event.clientY, active: false, moved: false };
        if (window.mischief && window.mischief.startDrag) {
          window.mischief.startDrag(event.clientX, event.clientY);
        }
      });

      window.addEventListener("pointermove", (event) => {
        if (!dragState) return;
        const dx = event.clientX - dragState.startX;
        const dy = event.clientY - dragState.startY;
        const DRAG_THRESHOLD = 5;
        if (!dragState.active && Math.hypot(dx, dy) > DRAG_THRESHOLD) {
          dragState.active = true;
          dragState.moved = true;
          lastDragMoved = true;
          dragging = true;
        }
        if (dragState.active && window.mischief && window.mischief.moveDrag) {
          window.mischief.moveDrag(event.clientX, event.clientY);
        }
      });

      window.addEventListener("pointerup", (event) => {
        if (window.mischief && window.mischief.endDrag) {
          window.mischief.endDrag();
        }
        dragState = null;
        dragging = false;
        // Re-sync click-through to the current cursor position: after dragging
        // the companion away, the cursor often ends over transparent space.
        if (window.mischief && window.mischief.setOverlayHit) {
          const hit = sampleHit(event.clientX, event.clientY);
          lastHit = hit;
          window.mischief.setOverlayHit(hit);
        }
      });

      // Suppress native image/HTML drag so only our custom drag runs.
      creature.addEventListener("dragstart", (event) => event.preventDefault());

      creature.addEventListener("click", (event) => {
        // A real drag suppresses the pet reaction.
        if (window.mischief && window.mischief.pet && !lastDragMoved) {
          window.mischief.pet(event.clientX, event.clientY);
        }
        lastDragMoved = false;
      });

      if (window.mischief && window.mischief.onInteractive) {
        window.mischief.onInteractive((enabled) => {
          document.body.classList.toggle("interactive", enabled);
        });
      }
    </script>
  </body>
</html>
