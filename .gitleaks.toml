# gitleaks configuration for Mischief
# Docs: https://gitleaks.io/configuration.html
# Defaults to the official ruleset plus repo-specific allowlists.

title = "Mischief secret scanning configuration"

[extend]
useDefault = true

[allowlist]
description = "Repository-wide allowlisted paths (never scanned)"
paths = [
  '''(^|/)\.git/''',
  '''(^|/)node_modules/''',
  '''(^|/)Main Docs/''',
  '''(^|/)release/''',
  '''(^|/)dist/''',
]
