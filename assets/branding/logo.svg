<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Dark Cosmic Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>

    <!-- Outer Rim Metallic Glass Gradient -->
    <linearGradient id="rim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Mascot Vibrant Gradient (Emerald -> Mint -> Electric Cyan) -->
    <linearGradient id="mascot-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="35%" stop-color="#34D399"/>
      <stop offset="70%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Spark / Magic Star Gradient -->
    <linearGradient id="spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Eye Iris Inner Glow -->
    <linearGradient id="eye-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Back Ambient Radial Glow -->
    <radialGradient id="ambient-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="shadow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- High-Glow Filter -->
    <filter id="glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background App Squircle Container -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="4" filter="url(#shadow-filter)"/>
  
  <!-- Outer Glass Rim Highlight -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="url(#rim-grad)" stroke-width="2.5"/>

  <!-- Ambient Glow Behind Mascot -->
  <circle cx="256" cy="270" r="180" fill="url(#ambient-glow)"/>

  <!-- Mascot Creature Group -->
  <g filter="url(#shadow-filter)">
    
    <!-- Left Ear / Antenna (Playful curved Fox/Cat ear) -->
    <path d="M 120 185 C 100 110, 155 90, 185 150 C 165 170, 140 185, 120 185 Z" fill="url(#mascot-grad)"/>
    <!-- Left Inner Ear Accent -->
    <path d="M 132 175 C 118 128, 152 112, 172 150 Z" fill="#0F172A" opacity="0.3"/>

    <!-- Right Ear / Antenna -->
    <path d="M 392 185 C 412 110, 357 90, 327 150 C 347 170, 372 185, 392 185 Z" fill="url(#mascot-grad)"/>
    <!-- Right Inner Ear Accent -->
    <path d="M 380 175 C 394 128, 360 112, 340 150 Z" fill="#0F172A" opacity="0.3"/>

    <!-- Main Mascot Body/Head (Smooth Rounded Character Silhouette) -->
    <path d="M 112 250 C 112 165, 400 165, 400 250 C 400 350, 350 395, 256 395 C 162 395, 112 350, 112 250 Z" fill="url(#mascot-grad)"/>

    <!-- Left Eye (Cheeky, Expressive Oval) -->
    <ellipse cx="195" cy="265" rx="28" ry="34" fill="url(#eye-glow)"/>
    <!-- Left Pupil Highlight Sparkles -->
    <circle cx="205" cy="253" r="10" fill="#FFFFFF"/>
    <circle cx="187" cy="277" r="4.5" fill="#FFFFFF" opacity="0.8"/>

    <!-- Right Eye (Cheeky, Expressive Oval) -->
    <ellipse cx="317" cy="265" rx="28" ry="34" fill="url(#eye-glow)"/>
    <!-- Right Pupil Highlight Sparkles -->
    <circle cx="327" cy="253" r="10" fill="#FFFFFF"/>
    <circle cx="309" cy="277" r="4.5" fill="#FFFFFF" opacity="0.8"/>

    <!-- Cheek Blushes -->
    <ellipse cx="155" cy="305" rx="16" ry="9" fill="#F43F5E" opacity="0.35"/>
    <ellipse cx="357" cy="305" rx="16" ry="9" fill="#F43F5E" opacity="0.35"/>

    <!-- Cheeky Mischievous Smile (Playful Curve) -->
    <path d="M 220 315 Q 256 350 292 315" fill="none" stroke="#0F172A" stroke-width="7" stroke-linecap="round"/>
    <!-- Cute Playful Tongue / Smile Accent -->
    <path d="M 242 331 Q 256 344 270 331 Z" fill="#F43F5E"/>
  </g>

  <!-- Floating Magic Spark Star (Representing Mischief & Antics) -->
  <g filter="url(#glow-filter)">
    <path d="M 375 110 Q 387 110 387 98 Q 387 110 399 110 Q 387 110 387 122 Q 387 110 375 110 Z" fill="url(#spark-grad)"/>
    <path d="M 125 105 Q 133 105 133 97 Q 133 105 141 105 Q 133 105 133 113 Q 133 105 125 105 Z" fill="url(#spark-grad)" transform="scale(0.7) translate(70, 40)"/>
  </g>
</svg>
