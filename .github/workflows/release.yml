name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  security:
    name: Security gate (audit + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --omit=dev

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  mac:
    name: macOS (universal)
    runs-on: macos-latest
    needs: security
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package (DMG + zip, universal)
        run: npx electron-builder --mac --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Generate checksums
        run: node scripts/generate-checksums.js

      - name: Upload per-platform checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums-mac
          path: release/SHA256SUMS

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/*.blockmap

  windows:
    name: Windows
    runs-on: windows-latest
    needs: security
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package (NSIS + portable)
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Generate checksums
        run: node scripts/generate-checksums.js

      - name: Upload per-platform checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums-windows
          path: release/SHA256SUMS

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.zip
            release/*.blockmap

  linux:
    name: Linux
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package (AppImage)
        run: npx electron-builder --linux --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Generate checksums
        run: node scripts/generate-checksums.js

      - name: Upload per-platform checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums-linux
          path: release/SHA256SUMS

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.AppImage
            release/*.tar.gz
            release/*.blockmap

  checksums:
    name: Release checksums (all platforms)
    runs-on: ubuntu-latest
    needs: [mac, windows, linux]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: checksums
          pattern: checksums-*

      - name: Merge SHA256SUMS
        run: |
          cat checksums/*/SHA256SUMS | sort -u > SHA256SUMS
          echo "Attaching checksums for $(wc -l < SHA256SUMS) file(s)."

      - name: Attach SHA256SUMS
        uses: softprops/action-gh-release@v2
        with:
          files: SHA256SUMS
          overwrite: true
