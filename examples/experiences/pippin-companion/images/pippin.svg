<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Penguin Tux Body Gradient -->
    <linearGradient id="penguin-tux" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Beak & Feet Orange -->
    <linearGradient id="beak-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Cozy Blue Scarf Gradient -->
    <linearGradient id="scarf-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <filter id="penguin-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#penguin-shadow)">
    <!-- Wings/Flippers -->
    <path d="M 22 55 C 10 65, 12 85, 28 80 Z" fill="url(#penguin-tux)"/>
    <path d="M 106 55 C 118 65, 116 85, 100 80 Z" fill="url(#penguin-tux)"/>

    <!-- Orange Feet -->
    <ellipse cx="48" cy="112" rx="10" ry="5" fill="url(#beak-orange)"/>
    <ellipse cx="80" cy="112" rx="10" ry="5" fill="url(#beak-orange)"/>

    <!-- Main Penguin Body Shape -->
    <path d="M 32 50 C 32 20, 96 20, 96 50 C 102 85, 96 110, 64 110 C 32 110, 26 85, 32 50 Z" fill="url(#penguin-tux)"/>

    <!-- White Belly Oval -->
    <ellipse cx="64" cy="72" rx="26" ry="32" fill="#F8FAFC"/>

    <!-- Eyes -->
    <ellipse cx="48" cy="46" rx="6.5" ry="8.5" fill="#0F172A"/>
    <ellipse cx="80" cy="46" rx="6.5" ry="8.5" fill="#0F172A"/>
    <circle cx="50" cy="43" r="3" fill="#FFFFFF"/>
    <circle cx="82" cy="43" r="3" fill="#FFFFFF"/>

    <!-- Cute Beak -->
    <polygon points="56,52 72,52 64,62" fill="url(#beak-orange)"/>

    <!-- Cozy Winter Scarf -->
    <rect x="36" y="62" width="56" height="10" rx="5" fill="url(#scarf-blue)"/>
    <rect x="74" y="68" width="12" height="20" rx="3" fill="url(#scarf-blue)"/>
    <line x1="74" y1="84" x2="86" y2="84" stroke="#F8FAFC" stroke-width="2"/>
  </g>
</svg>
