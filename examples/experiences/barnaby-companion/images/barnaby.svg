<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Capybara Fur Gradient -->
    <linearGradient id="capy-fur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A16207"/>
      <stop offset="50%" stop-color="#854D0E"/>
      <stop offset="100%" stop-color="#713F12"/>
    </linearGradient>

    <!-- Orange Slice Gradient -->
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <filter id="soft-capy-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#soft-capy-shadow)">
    <!-- Small Ears -->
    <ellipse cx="38" cy="38" rx="6" ry="4" fill="#713F12"/>
    <ellipse cx="90" cy="38" rx="6" ry="4" fill="#713F12"/>

    <!-- Orange Slice Balanced on Head -->
    <path d="M 52 24 A 12 12 0 0 1 76 24 Z" fill="url(#orange-grad)"/>
    <circle cx="64" cy="24" r="1.5" fill="#FEF08A"/>

    <!-- Head Body -->
    <path d="M 32 45 C 32 30, 96 30, 96 45 C 100 65, 95 80, 64 82 C 33 80, 28 65, 32 45 Z" fill="url(#capy-fur)"/>

    <!-- Eyes (Ultra Chill Closed Curved Lines) -->
    <path d="M 44 50 Q 48 54 52 50" fill="none" stroke="#451A03" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 76 50 Q 80 54 84 50" fill="none" stroke="#451A03" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Capybara Muzzle & Nose -->
    <ellipse cx="64" cy="62" rx="14" ry="10" fill="#713F12" opacity="0.6"/>
    <ellipse cx="64" cy="58" rx="6" ry="3" fill="#451A03"/>
    <path d="M 64 61 L 64 65 M 60 67 Q 64 69 68 67" fill="none" stroke="#451A03" stroke-width="2" stroke-linecap="round"/>

    <!-- Body & Paws -->
    <ellipse cx="64" cy="96" rx="36" ry="22" fill="url(#capy-fur)"/>

    <!-- Steaming Coffee Mug -->
    <rect x="92" y="82" width="16" height="18" rx="3" fill="#38BDF8"/>
    <path d="M 108 86 C 112 86, 112 94, 108 94" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <path d="M 98 78 Q 96 72 98 68" fill="none" stroke="#CBD5E1" stroke-width="1.5" opacity="0.7"/>
  </g>
</svg>
