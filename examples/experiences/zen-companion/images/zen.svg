<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Red Panda Fur Gradient -->
    <linearGradient id="fur-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>

    <!-- White Cheek/Muzzle Gradient -->
    <linearGradient id="white-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Tea Cup Gradient -->
    <linearGradient id="tea-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CC16"/>
      <stop offset="100%" stop-color="#65A30D"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Fluffy Striped Tail -->
    <path d="M 20 75 C 5 70, 5 95, 25 105 C 40 110, 45 95, 35 85 Z" fill="url(#fur-grad)"/>
    <path d="M 12 78 C 10 84, 15 90, 20 86 Z" fill="#7C2D12"/>
    <path d="M 22 92 C 18 98, 25 102, 30 96 Z" fill="#7C2D12"/>

    <!-- Left Ear -->
    <polygon points="32,25 50,45 28,50" fill="url(#fur-grad)"/>
    <polygon points="35,30 45,43 32,46" fill="url(#white-grad)"/>

    <!-- Right Ear -->
    <polygon points="96,25 78,45 100,50" fill="url(#fur-grad)"/>
    <polygon points="93,30 83,43 96,46" fill="url(#white-grad)"/>

    <!-- Main Head -->
    <ellipse cx="64" cy="55" rx="38" ry="30" fill="url(#fur-grad)"/>

    <!-- White Face Marking Eyebrows & Cheeks -->
    <ellipse cx="42" cy="62" rx="14" ry="12" fill="url(#white-grad)"/>
    <ellipse cx="86" cy="62" rx="14" ry="12" fill="url(#white-grad)"/>
    <circle cx="48" cy="40" r="5" fill="url(#white-grad)"/>
    <circle cx="80" cy="40" r="5" fill="url(#white-grad)"/>

    <!-- Eyes (Mindful, Smiling Arches) -->
    <ellipse cx="48" cy="55" rx="5" ry="6" fill="#0F172A"/>
    <ellipse cx="80" cy="55" rx="5" ry="6" fill="#0F172A"/>
    <circle cx="49" cy="53" r="2" fill="#FFFFFF"/>
    <circle cx="81" cy="53" r="2" fill="#FFFFFF"/>

    <!-- Cute Muzzle & Nose -->
    <ellipse cx="64" cy="64" rx="9" ry="7" fill="url(#white-grad)"/>
    <polygon points="61,61 67,61 64,65" fill="#7C2D12"/>
    <path d="M 64 65 Q 64 68 61 69 M 64 65 Q 64 68 67 69" fill="none" stroke="#7C2D12" stroke-width="2" stroke-linecap="round"/>

    <!-- Body & Paws -->
    <ellipse cx="64" cy="92" rx="28" ry="24" fill="url(#fur-grad)"/>
    <ellipse cx="64" cy="94" rx="18" ry="16" fill="#7C2D12"/>

    <!-- Tiny Steaming Green Tea Cup (Holding in Paws) -->
    <rect x="54" y="86" width="20" height="16" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <ellipse cx="64" cy="86" rx="9" ry="3" fill="url(#tea-grad)"/>
    <!-- Steam Lines -->
    <path d="M 60 82 Q 58 76 60 72" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 68 83 Q 70 77 68 73" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
