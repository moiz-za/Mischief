<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Golden Bread Loaf Fur Gradient -->
    <linearGradient id="shiba-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- White Cream Muzzle & Underbelly -->
    <linearGradient id="cream-white" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Chef Toque Hat Gradient -->
    <linearGradient id="chef-hat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <filter id="mochi-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#mochi-shadow)">
    <!-- Curly Tail (Donut / Cinnamon Roll Tail) -->
    <path d="M 22 68 C 5 50, 10 90, 30 80 C 40 75, 30 60, 24 68 Z" fill="url(#shiba-gold)"/>

    <!-- Shiba Ears -->
    <polygon points="34,34 50,52 30,58" fill="url(#shiba-gold)"/>
    <polygon points="94,34 78,52 98,58" fill="url(#shiba-gold)"/>
    <polygon points="37,38 46,50 33,54" fill="url(#cream-white)"/>
    <polygon points="91,38 82,50 95,54" fill="url(#cream-white)"/>

    <!-- Chef Toque Baker Hat -->
    <path d="M 52 30 C 48 18, 80 18, 76 30 Z" fill="url(#chef-hat)"/>
    <ellipse cx="64" cy="22" rx="16" ry="10" fill="url(#chef-hat)"/>
    <rect x="52" y="28" width="24" height="6" fill="#E2E8F0" rx="1"/>

    <!-- Main Shiba Loaf Head -->
    <ellipse cx="64" cy="62" rx="36" ry="28" fill="url(#shiba-gold)"/>

    <!-- White Cheek Markings -->
    <ellipse cx="44" cy="68" rx="12" ry="10" fill="url(#cream-white)"/>
    <ellipse cx="84" cy="68" rx="12" ry="10" fill="url(#cream-white)"/>
    <circle cx="48" cy="48" r="4" fill="url(#cream-white)"/>
    <circle cx="80" cy="48" r="4" fill="url(#cream-white)"/>

    <!-- Eye (Happy Curved Arches) -->
    <path d="M 48 60 Q 52 56 56 60" fill="none" stroke="#451A03" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 72 60 Q 76 56 80 60" fill="none" stroke="#451A03" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Cute Muzzle & Nose -->
    <ellipse cx="64" cy="70" rx="8" ry="6" fill="url(#cream-white)"/>
    <ellipse cx="64" cy="66" rx="4" ry="2.5" fill="#451A03"/>
    <path d="M 64 68.5 Q 64 72 61 73 M 64 68.5 Q 64 72 67 73" fill="none" stroke="#451A03" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Squishy Loaf Body -->
    <ellipse cx="64" cy="94" rx="34" ry="20" fill="url(#shiba-gold)"/>
    <ellipse cx="64" cy="96" rx="20" ry="14" fill="url(#cream-white)"/>
  </g>
</svg>
