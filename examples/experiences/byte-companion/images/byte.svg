<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- CRT Monitor Body Gradient -->
    <linearGradient id="crt-casing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Green Terminal Screen -->
    <linearGradient id="crt-screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022C22"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <!-- Glowing Green Phosphor -->
    <linearGradient id="phosphor-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Rocket Flame -->
    <linearGradient id="rocket-flame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <filter id="bot-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#bot-shadow)">
    <!-- Top Antenna with Red Bulb -->
    <rect x="62" y="10" width="4" height="18" fill="#64748B"/>
    <circle cx="64" cy="8" r="5" fill="#EF4444"/>

    <!-- Rocket Hover Flame (Bottom) -->
    <polygon points="56,104 72,104 64,124" fill="url(#rocket-flame)"/>

    <!-- Main CRT Monitor Head/Body -->
    <rect x="24" y="24" width="80" height="70" rx="12" fill="url(#crt-casing)" stroke="#64748B" stroke-width="2"/>

    <!-- CRT Screen Bezel Inner -->
    <rect x="32" y="32" width="64" height="52" rx="6" fill="url(#crt-screen)" stroke="#065F46" stroke-width="2"/>

    <!-- CRT Screen Scanline Accent -->
    <line x1="32" y1="46" x2="96" y2="46" stroke="#059669" stroke-width="1" opacity="0.3"/>
    <line x1="32" y1="60" x2="96" y2="60" stroke="#059669" stroke-width="1" opacity="0.3"/>

    <!-- 8-Bit ASCII Phosphor Face: ^ _ ^ -->
    <!-- Left Eye ^ -->
    <path d="M 44 54 L 50 48 L 56 54" fill="none" stroke="url(#phosphor-green)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Eye ^ -->
    <path d="M 72 54 L 78 48 L 84 54" fill="none" stroke="url(#phosphor-green)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Smile _ -->
    <path d="M 58 66 L 70 66" fill="none" stroke="url(#phosphor-green)" stroke-width="3" stroke-linecap="round"/>

    <!-- Side Bolts / Ear Knobs -->
    <rect x="18" y="52" width="6" height="14" rx="2" fill="#475569"/>
    <rect x="104" y="52" width="6" height="14" rx="2" fill="#475569"/>

    <!-- Bottom Thruster Nozzle -->
    <rect x="52" y="94" width="24" height="10" rx="2" fill="#475569"/>
  </g>
</svg>
