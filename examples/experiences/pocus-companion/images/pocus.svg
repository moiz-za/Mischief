<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Translucent Ghost Body Gradient -->
    <linearGradient id="ghost-sheet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#E2E8F0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Candle Flame Gold -->
    <linearGradient id="flame-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <filter id="ghost-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#ghost-glow)">
    <!-- Wavy Ghost Body -->
    <path d="M 32 60 C 32 20, 96 20, 96 60 C 96 90, 88 110, 80 100 C 72 90, 68 110, 64 100 C 60 90, 56 110, 48 100 C 40 90, 32 105, 32 60 Z" fill="url(#ghost-sheet)"/>

    <!-- Soft Big Glowing Eyes -->
    <ellipse cx="48" cy="50" rx="7" ry="9" fill="#0F172A"/>
    <ellipse cx="80" cy="50" rx="7" ry="9" fill="#0F172A"/>
    <circle cx="50" cy="46" r="3" fill="#FFFFFF"/>
    <circle cx="82" cy="46" r="3" fill="#FFFFFF"/>

    <!-- Cute O-shaped Mouth -->
    <ellipse cx="64" cy="62" rx="4" ry="5" fill="#0F172A"/>

    <!-- Rosy Cheek Blushes -->
    <ellipse cx="40" cy="58" rx="5" ry="3" fill="#F43F5E" opacity="0.3"/>
    <ellipse cx="88" cy="58" rx="5" ry="3" fill="#F43F5E" opacity="0.3"/>

    <!-- Tiny Floating Magic Candle -->
    <rect x="94" y="32" width="6" height="12" rx="1.5" fill="#FEF08A"/>
    <path d="M 97 26 Q 99 22 97 18 Q 95 22 97 26 Z" fill="url(#flame-gold)"/>
  </g>
</svg>
