<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Sunflower Petal Yellow -->
    <linearGradient id="sun-petal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>

    <!-- Seed Face Brown -->
    <linearGradient id="seed-brown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

    <!-- Terracotta Pot -->
    <linearGradient id="terra-pot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>

    <filter id="sola-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#sola-shadow)">
    <!-- Terracotta Pot Base -->
    <polygon points="40,84 88,84 82,118 46,118" fill="url(#terra-pot)"/>
    <rect x="36" y="78" width="56" height="8" rx="2" fill="#EA580C"/>
    <line x1="48" y1="114" x2="80" y2="114" stroke="#7C2D12" stroke-width="2" stroke-linecap="round"/>

    <!-- Green Stem & Leaves -->
    <path d="M 64 52 L 64 80" stroke="#16A34A" stroke-width="6" stroke-linecap="round"/>
    <path d="M 64 68 C 48 62, 38 72, 44 76 Z" fill="#22C55E"/>
    <path d="M 64 64 C 80 58, 90 68, 84 72 Z" fill="#22C55E"/>

    <!-- Sunflower Petals Circle (12 Petals) -->
    <!-- Top & Bottom Petals -->
    <ellipse cx="64" cy="18" rx="7" ry="14" fill="url(#sun-petal)"/>
    <ellipse cx="64" cy="74" rx="7" ry="14" fill="url(#sun-petal)"/>
    <!-- Left & Right Petals -->
    <ellipse cx="36" cy="46" rx="14" ry="7" fill="url(#sun-petal)"/>
    <ellipse cx="92" cy="46" rx="14" ry="7" fill="url(#sun-petal)"/>
    <!-- Diagonal Petals -->
    <ellipse cx="44" cy="26" rx="8" ry="14" transform="rotate(-45 44 26)" fill="url(#sun-petal)"/>
    <ellipse cx="84" cy="26" rx="8" ry="14" transform="rotate(45 84 26)" fill="url(#sun-petal)"/>
    <ellipse cx="44" cy="66" rx="8" ry="14" transform="rotate(45 44 66)" fill="url(#sun-petal)"/>
    <ellipse cx="84" cy="66" rx="8" ry="14" transform="rotate(-45 84 66)" fill="url(#sun-petal)"/>

    <!-- Center Seed Face -->
    <circle cx="64" cy="46" r="20" fill="url(#seed-brown)"/>

    <!-- Smiling Eyes -->
    <circle cx="56" cy="44" r="3.5" fill="#FEF08A"/>
    <circle cx="72" cy="44" r="3.5" fill="#FEF08A"/>

    <!-- Big Happy Smile -->
    <path d="M 56 50 Q 64 58 72 50" fill="none" stroke="#FEF08A" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Rosy Cheek Blushes -->
    <circle cx="49" cy="50" r="3" fill="#F43F5E" opacity="0.4"/>
    <circle cx="79" cy="50" r="3" fill="#F43F5E" opacity="0.4"/>
  </g>
</svg>
