<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Mecha Metallic Body Gradient -->
    <linearGradient id="mecha-armor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Holo Cyan Glow -->
    <linearGradient id="holo-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <filter id="mecha-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#mecha-glow)">
    <!-- Anti-Gravity Tail (Segmented Floating Nodes) -->
    <path d="M 28 65 Q 12 50 16 80 Q 20 95 32 85" fill="none" stroke="url(#holo-cyan)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="14" cy="78" r="4" fill="url(#holo-cyan)"/>

    <!-- Mecha Cat Ears -->
    <polygon points="30,22 52,44 24,50" fill="url(#mecha-armor)"/>
    <polygon points="98,22 76,44 104,50" fill="url(#mecha-armor)"/>
    <polygon points="34,27 46,42 28,46" fill="url(#holo-cyan)"/>
    <polygon points="94,27 82,42 100,46" fill="url(#holo-cyan)"/>

    <!-- Main Mecha Head -->
    <path d="M 30 52 C 30 28, 98 28, 98 52 C 104 82, 98 90, 64 92 C 30 90, 24 82, 30 52 Z" fill="url(#mecha-armor)"/>

    <!-- Visor Face Plate -->
    <path d="M 38 52 Q 64 42 90 52 Q 84 68 64 70 Q 44 68 38 52 Z" fill="#020617" stroke="url(#holo-cyan)" stroke-width="1.5"/>

    <!-- Glowing Cat Eyes (Cyber Slits) -->
    <polygon points="46,55 56,55 52,62 48,62" fill="url(#holo-cyan)"/>
    <polygon points="82,55 72,55 76,62 80,62" fill="url(#holo-cyan)"/>

    <!-- Holo Whiskers -->
    <line x1="20" y1="58" x2="34" y2="60" stroke="url(#holo-cyan)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="18" y1="66" x2="34" y2="65" stroke="url(#holo-cyan)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="108" y1="58" x2="94" y2="60" stroke="url(#holo-cyan)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="110" y1="66" x2="94" y2="65" stroke="url(#holo-cyan)" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Anti-Gravity Floating Paws -->
    <ellipse cx="44" cy="98" rx="8" ry="4" fill="url(#holo-cyan)"/>
    <ellipse cx="84" cy="98" rx="8" ry="4" fill="url(#holo-cyan)"/>

    <!-- Mecha Body Armor -->
    <ellipse cx="64" cy="94" rx="24" ry="18" fill="url(#mecha-armor)"/>
    <rect x="52" y="88" width="24" height="4" rx="2" fill="url(#holo-cyan)"/>
  </g>
</svg>
